<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full Stick Network</title>
<style>
  body { margin: 0; background: #fff; color: #000; font: 14px/1.4 system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; }
  svg { width: min(900px, 100vw - 32px); height: auto; }
  rect { fill: #fff; stroke: #000; stroke-width: 1.5; }
  line { stroke: #000; stroke-width: 1.5; }
  .dash { stroke-dasharray: 6 5; }
  text { fill: #000; text-anchor: middle; }
  .name { font-size: 15px; font-weight: 600; }
  .sub, .ms { font-size: 12px; }
  .ms { fill: #555; }
  .lan { fill: none; stroke: #000; stroke-width: 1; stroke-dasharray: 2 4; }
</style>
</head>
<body>
<svg viewBox="0 0 900 380" role="img" aria-label="IMU は BLE でスマホに、スマホ 2 台は LAN の WebSocket でサーバーにつながる">
  <!-- LAN (Wi-Fi) -->
  <rect class="lan" x="320" y="20" width="560" height="340" rx="12"/>
  <text x="850" y="44" class="sub" style="text-anchor:end">LAN（Wi-Fi）</text>

  <!-- links -->
  <line x1="150" y1="100" x2="360" y2="100" class="dash"/>
  <line x1="150" y1="280" x2="360" y2="280" class="dash"/>
  <line x1="520" y1="100" x2="660" y2="170"/>
  <line x1="520" y1="280" x2="660" y2="210"/>

  <text x="255" y="90" class="sub">Bluetooth LE</text>
  <text x="255" y="122" class="ms">100 Hz · 約 10 ms</text>
  <text x="255" y="270" class="sub">Bluetooth LE</text>
  <text x="255" y="302" class="ms">100 Hz · 約 10 ms</text>

  <text x="600" y="118" class="sub">WebSocket</text>
  <text x="600" y="134" class="ms">約 10–30 ms</text>
  <text x="600" y="256" class="sub">WebSocket</text>
  <text x="600" y="272" class="ms">約 10–30 ms</text>

  <!-- nodes -->
  <rect x="30" y="70" width="120" height="60"/>
  <text x="90" y="97" class="name">IMU A</text><text x="90" y="115" class="sub">WT9011DCL</text>
  <rect x="30" y="250" width="120" height="60"/>
  <text x="90" y="277" class="name">IMU B</text><text x="90" y="295" class="sub">WT9011DCL</text>

  <rect x="360" y="70" width="160" height="60"/>
  <text x="440" y="97" class="name">Client A</text><text x="440" y="115" class="sub">スマホ（SensorLink）</text>
  <rect x="360" y="250" width="160" height="60"/>
  <text x="440" y="277" class="name">Client B</text><text x="440" y="295" class="sub">スマホ（SensorLink）</text>

  <rect x="660" y="155" width="190" height="70"/>
  <text x="755" y="184" class="name">Server</text><text x="755" y="203" class="sub">PC · node server.mjs :8000</text>
</svg>
</body>
</html>
