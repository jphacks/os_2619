<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full Stick Network</title>
<style>
  body { margin: 0; background: #fff; color: #000; font: 16px/1.4 system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; }
  svg { width: min(1000px, 100vw - 32px); height: auto; }
  .man { fill: #9a9a9a; }
  .red { fill: #e01b1b; stroke: #e01b1b; }
  .bar { fill: none; stroke: #e01b1b; stroke-width: 7; stroke-linecap: round; }
  .link { fill: none; stroke: #000; stroke-width: 1.6; }
  text { fill: #000; text-anchor: middle; font-size: 16px; }
  .name { font-size: 19px; font-weight: 600; }
</style>
</head>
<body>
<svg viewBox="0 0 900 450" role="img" aria-label="向かい合う二人が棒を持つ。棒の IMU は BLE で胸のスマホに、スマホは Wi-Fi の WebSocket で間の PC につながる">
  <defs>
    <!-- a person facing right (grey silhouette), holding the stick (red, its IMU on it) out in front, the phone on the chest tilted 45° down -->
    <g id="man">
      <ellipse class="man" cx="154" cy="88" rx="20" ry="24"/>
      <path class="man" d="M146 106 C140 122 128 126 124 142 C118 170 120 205 126 236 C128 252 124 262 126 276
        C126 310 118 350 116 392 L114 404 L150 404 L141 391 C143 352 147 318 152 292 L156 292
        C162 322 170 354 177 392 L176 404 L212 404 L197 390 C191 350 187 314 181 280
        C179 262 182 248 179 232 C176 210 179 190 177 166 C176 148 170 132 162 120 C160 116 159 112 160 106 Z"/>
      <line class="bar" x1="226" y1="194" x2="338" y2="82"/>
      <rect class="red" x="273" y="132" width="18" height="12" rx="2" transform="rotate(-45 282 138)"/>
      <path class="man" d="M144 128 C166 126 188 140 204 150 L234 168 C242 170 249 178 245 186 C241 193 232 191 227 188 L196 173 C178 165 160 162 148 158 Z"/>
      <circle class="man" cx="240" cy="180" r="9"/>
      <rect class="red" x="187" y="170" width="7" height="24" rx="2" transform="rotate(45 190 182)"/>
    </g>
  </defs>

  <line x1="20" y1="404" x2="880" y2="404" stroke="#000" stroke-width="1"/>
  <use href="#man"/>
  <use href="#man" transform="translate(900 0) scale(-1 1)"/>

  <!-- PC on a table -->
  <path class="man" d="M406 333 H494 V339 H486 V395 H480 V339 H420 V395 H414 V339 H406 Z"/>
  <rect class="red" x="420" y="284" width="60" height="40" rx="3"/>
  <path class="red" d="M412 325 H488 L494 332 H406 Z"/>

  <!-- communication -->
  <path class="link" d="M192 176 Q252 168 276 144"/>
  <path class="link" d="M708 176 Q648 168 624 144"/>
  <line class="link" x1="194" y1="182" x2="416" y2="298"/>
  <line class="link" x1="706" y1="182" x2="484" y2="298"/>

  <text x="322" y="150" style="text-anchor:start">BLE</text><text x="322" y="170" style="text-anchor:start">約 10 ms</text>
  <text x="578" y="150" style="text-anchor:end">BLE</text><text x="578" y="170" style="text-anchor:end">約 10 ms</text>
  <text x="450" y="206">WebSocket（Wi-Fi）</text><text x="450" y="226">約 10–30 ms</text>
  <text x="266" y="126" style="text-anchor:end">IMU</text><text x="634" y="126" style="text-anchor:start">IMU</text>

  <text x="450" y="272" class="name">Server</text>
  <text x="150" y="434" class="name">Client A</text>
  <text x="750" y="434" class="name">Client B</text>
</svg>
</body>
</html>
