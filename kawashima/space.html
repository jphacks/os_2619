<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生の3D情報</title>
<style>
  :root { --bg: #0d0f14; --fg: #e7e9ee; --dim: #9aa3b2; --panel: #161a22; --line: #2b3240; --a: #ff9a4d; --b: #6cc8ff; --tag: #3ddc84; --chest: #ff4df0; --ghost: #c9c9c9; --cam: #ffd23d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 12px/1.45 system-ui, -apple-system, "Hiragino Sans", sans-serif; overflow: hidden; }
  #wrap { display: grid; grid-template-columns: 1fr 340px; grid-template-rows: 36px 1fr; height: 100%; }
  #top { grid-column: 1 / 3; display: flex; align-items: center; gap: 14px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #top b { font-size: 14px; }
  #top .dim { color: var(--dim); }
  #top .ok { color: var(--tag); } #top .ng { color: #ff6b6b; }
  #view { position: relative; min-width: 0; }
  #view canvas { display: block; width: 100%; height: 100%; }
  #legend { position: absolute; left: 10px; top: 10px; background: rgba(13, 15, 20, .82); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 290px; }
  #legend label { display: flex; align-items: center; gap: 6px; margin: 2px 0; cursor: pointer; white-space: nowrap; }
  #legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
  #legend i.dash { background: repeating-linear-gradient(90deg, var(--ghost) 0 4px, transparent 4px 7px) !important; }
  #legend .note { color: var(--dim); margin-top: 4px; white-space: normal; }
  #legend input { margin: 0; accent-color: #a99dff; }
  #hint { position: absolute; left: 10px; bottom: 8px; color: var(--dim); text-shadow: 0 0 4px #000; }
  #panel { overflow: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 10px 12px; }
  #panel h3 { margin: 10px 0 4px; font-size: 12px; color: var(--dim); font-weight: 600; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
  #panel h3:first-child { margin-top: 0; }
  #panel table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  #panel td { padding: 1px 4px 1px 0; vertical-align: top; }
  #panel td:first-child { color: var(--dim); white-space: nowrap; width: 92px; }
  #panel td.v { font-family: ui-monospace, Menlo, monospace; font-size: 11px; word-break: break-all; }
  .A { color: var(--a); } .B { color: var(--b); }
  .warn { color: #ffcc4d; }
</style>
<script type="importmap">{ "imports": { "three": "./cdn/npm/three@0.160.0/build/three.module.js", "three/addons/": "./cdn/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div id="wrap">
  <div id="top"><b>生の3D情報</b><span id="link" class="dim">接続中…</span><span id="hostLabel" class="dim"></span><span id="fieldLabel" class="dim"></span><span id="fps" class="dim"></span></div>
  <div id="view">
    <canvas id="gl"></canvas>
    <div id="legend"></div>
    <div id="hint">ドラッグで回転、右ドラッグで移動、ホイールで拡大。単位 m、y が上。</div>
  </div>
  <div id="panel"></div>
</div>
<script type="module" src="./space.js"></script>
</body>
</html>
