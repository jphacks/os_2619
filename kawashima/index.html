<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>棒バトル エフェクト</title>
<style>
  :root { --bg: #000; --fg: #f4f4f4; --dim: #9a9a9a; --panel: rgba(16, 16, 20, .88); --fire: #ff7a1a; --thunder: #6cc8ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #111; }
  #stage video, #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #stage video { display: none; }
  #stage #minimap { inset: auto; left: 12px; bottom: 34px; width: min(28%, 28vh); height: auto; aspect-ratio: 1; pointer-events: none; }
  #pipLabel { position: absolute; right: 16px; bottom: calc(30% + 20px); color: var(--dim); font-size: 11px; text-shadow: 0 0 4px #000; }
  .hud { position: absolute; top: 12px; width: 38%; }
  .hud.A { left: 16px; } .hud.B { right: 16px; text-align: right; }
  .hud .name { font-weight: 700; font-size: 18px; text-shadow: 0 0 6px #000; }
  .hud .bar { height: 14px; background: rgba(255,255,255,.15); border-radius: 7px; overflow: hidden; margin-top: 4px; }
  .hud .bar i { display: block; height: 100%; width: 100%; transition: width .15s; }
  .hud.A .bar i { background: var(--fire); } .hud.B .bar i { background: var(--thunder); margin-left: auto; }
  .hud .off { color: var(--dim); font-weight: 400; font-size: 12px; }
  #timer { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; text-shadow: 0 0 8px #000; }
  #phase { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); padding: 3px 14px; border-radius: 999px; background: rgba(0,0,0,.55); color: var(--dim); font-size: 14px; letter-spacing: .1em; }
  #banner { position: absolute; inset: 0; display: none; place-items: center; font-size: 72px; font-weight: 900; text-shadow: 0 0 24px #000; pointer-events: none; }
  #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s; }
  #status { position: absolute; left: 16px; bottom: 10px; color: var(--dim); text-shadow: 0 0 4px #000; }
  #panel { position: absolute; right: 12px; bottom: 12px; width: 300px; max-height: calc(100% - 24px); overflow: auto; background: var(--panel); border-radius: 8px; padding: 12px; display: none; }
  #panel.open { display: block; }
  #panel h3 { margin: 10px 0 6px; font-size: 12px; color: var(--dim); font-weight: 600; }
  #panel label { display: grid; grid-template-columns: 90px 1fr 44px; gap: 6px; align-items: center; margin: 3px 0; }
  #panel input[type=range] { width: 100%; }
  #panel select, #panel input[type=text] { width: 100%; background: #222; color: var(--fg); border: 1px solid #444; border-radius: 4px; padding: 2px 4px; }
  #panel output { text-align: right; font-variant-numeric: tabular-nums; }
  #panel .keys { color: var(--dim); margin-top: 10px; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div id="stage">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="gl"></canvas>
  <div id="flash"></div>
  <div class="hud A"><div class="name">A 炎 <span class="off">offline</span></div><div class="bar"><i></i></div></div>
  <div class="hud B"><div class="name"><span class="off">offline</span> 雷 B</div><div class="bar"><i></i></div></div>
  <div id="timer" style="display:none"></div>
  <div id="phase"></div>
  <div id="banner"></div>
  <div id="pipLabel">3D ビュー（V で全画面、D でドローン視点を切替）</div>
  <div id="status"></div>
</div>
<div id="panel"></div>
<script type="module" src="app.js"></script>
</body>
</html>
