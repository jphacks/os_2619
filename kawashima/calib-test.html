<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag Calibration Test</title>
<style>
  :root { --bg: #0d0f14; --fg: #eee; --dim: #9a9a9a; --ok: #6f6; --ng: #f66; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 ui-monospace, Menlo, monospace; }
  #stage { position: relative; width: 960px; height: 540px; background: #111; }
  #stage > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  #snap { display: none; }
  .still #snap { display: block; } .still video { visibility: hidden; }
  pre { margin: 8px 0; white-space: pre-wrap; }
  .ok { color: var(--ok); } .ng { color: var(--ng); } .dim { color: var(--dim); }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<div id="stage"><video id="video" autoplay muted playsinline></video><canvas id="snap"></canvas><canvas id="gl"></canvas><canvas id="marks"></canvas></div>
<pre id="out">loading…</pre>
<script type="module">
// Dummy third-person camera -> calibrateCamera -> compare with the true pose. Overlay = grid + tags drawn with the ESTIMATED camera.
// ?still: show the exact frame that was calibrated (headless screenshots), ?guess=50 fov guess, ?sweep: several camera poses.
import * as THREE from 'three';
import * as W from './world.js';
import { createDummyCam, lookAtPose } from './dummycam.js';
import { calibrateCamera, toThreeCamera, projectWorld } from './extrinsics.js';

const q = new URLSearchParams(location.search), out = document.getElementById('out');
const stage = document.getElementById('stage'), video = document.getElementById('video');
if (q.has('still')) stage.classList.add('still');
const guess = +(q.get('guess') ?? 50);
const lines = [];
const log = (s, cls = '') => { console.log(s); lines.push(cls ? `<span class="${cls}">${s}</span>` : s); out.innerHTML = lines.join('\n'); };

// ---- overlay (estimated camera) ----
const gl = document.getElementById('gl'), renderer = new THREE.WebGLRenderer({ canvas: gl, alpha: true, antialias: true });
renderer.setSize(960, 540, false);
const scene = new THREE.Scene(), cam3 = new THREE.PerspectiveCamera(50, 16 / 9, .05, 100);
const grid = new THREE.GridHelper(2 * W.ARENA.half, 8, 0x00ff88, 0x00ff88); grid.material.transparent = true; grid.material.opacity = .6; scene.add(grid);
const lineMat = new THREE.LineBasicMaterial({ color: 0xff00ff });
for (const id of W.CORNER_IDS) {
  const tp = W.worldTagPose(id), h = W.TAGS[id].size / 2;
  const pts = [[-h, h], [h, h], [h, -h], [-h, -h]].map(([x, y]) => new THREE.Vector3(...W.apply(tp, [x, y, 0])));
  scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), lineMat));
  const foot = new THREE.Vector3(tp.t[0], 0, tp.t[2]); // pole
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([foot, new THREE.Vector3(...tp.t)]), lineMat));
  const n = new THREE.Vector3(...W.apply(tp, [0, 0, .3])); // tag normal
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...tp.t), n]), new THREE.LineBasicMaterial({ color: 0xffff00 })));
}
const marks = document.getElementById('marks'); marks.width = 960; marks.height = 540;
const mx = marks.getContext('2d');

function drawOverlay(r) {
  toThreeCamera(r, cam3); renderer.render(scene, cam3);
  mx.clearRect(0, 0, 960, 540); const s = 960 / r.width;
  mx.strokeStyle = '#f33'; mx.lineWidth = 1.5;
  for (const t of r.tags) t.corners.forEach(([u, v], k) => {
    mx.beginPath(); mx.moveTo(u * s - 5, v * s); mx.lineTo(u * s + 5, v * s); mx.moveTo(u * s, v * s - 5); mx.lineTo(u * s, v * s + 5); mx.stroke();
    if (k === 0) { mx.fillStyle = '#f33'; mx.fillText(`${t.id}`, u * s + 4, v * s - 4); }
  });
}

// ---- error metrics ----
const d2r = Math.PI / 180;
function compare(r, truth, w, h) {
  const pos = Math.hypot(...r.pose.t.map((v, i) => v - truth.t[i])) * 100;
  const D = W.mul3(W.tr3(truth.R), r.pose.R), ang = Math.acos(Math.max(-1, Math.min(1, (D[0] + D[4] + D[8] - 1) / 2))) / d2r;
  // corner detection error against the true projection (also proves the corner order)
  const tp = { ...truth, width: w, height: h };
  let se = 0, n = 0;
  for (const t of r.tags) {
    let st = 0;
    const ts = W.worldTagPose(t.id), hh = W.TAGS[t.id].size / 2;
    [[-hh, hh], [hh, hh], [hh, -hh], [-hh, -hh]].forEach(([x, y], k) => { const p = projectWorld(tp, W.apply(ts, [x, y, 0])); const e2 = (p[0] - t.corners[k][0]) ** 2 + (p[1] - t.corners[k][1]) ** 2; se += e2; st += e2; n++; });
    t.err = Math.sqrt(st / 4);
  }
  return { pos, ang, fov: r.fovY - truth.fovY, det: Math.sqrt(se / n) };
}
const fmt = (v, d = 2) => v.toFixed(d);
const pass = e => e.pos < 5 && e.ang < 1 && Math.abs(e.fov) < 2;

// headless rAF may stall: drive the dummy room explicitly so the multi-frame calibration sees players move
function drive(c, t = 1) { c.render(t); const h = setInterval(() => c.render(t += .15), 50); return () => clearInterval(h); }
async function runOnce(cam, label, time = 1) {
  const stopDrive = drive(cam, time);
  const t0 = performance.now(), r = await calibrateCamera(cam.canvas, { fovYGuess: guess }), ms = performance.now() - t0;
  stopDrive();
  if (!r) { log(`${label}: no corner tag found`, 'ng'); return null; }
  const e = compare(r, cam.truePose, cam.canvas.width, cam.canvas.height);
  log(`${label}: tags ${r.tags.map(t => `${t.id}(${t.seen}f ${fmt(t.err)}px m${fmt(t.misfit, 3)})`).join(' ')}  pos err ${fmt(e.pos)} cm  angle err ${fmt(e.ang, 3)}°  fov ${fmt(r.fovY)}° (true ${cam.truePose.fovY}, err ${fmt(e.fov)})  reproj ${fmt(r.reprojErrPx, 3)} px  corner-vs-truth ${fmt(e.det, 3)} px  ${fmt(ms, 0)} ms  ${pass(e) ? 'PASS' : 'FAIL'}`, pass(e) ? 'ok' : 'ng');
  return { r, e };
}

const P = q.get('pose')?.split(',').map(Number);
const cam = createDummyCam({ width: 1280, height: 720, host: q.get('host') ?? 'localhost:8000', fovY: +(q.get('fov') ?? 55), ...(P ? { pose: lookAtPose(P, [0, 1, -.5], 2) } : {}) });
video.srcObject = cam.stream;
const snap = document.getElementById('snap'); snap.width = 1280; snap.height = 720;
log(`true cam: pos [${cam.truePose.t.map(v => fmt(v))}]  fovY ${cam.truePose.fovY}°   fov guess ${guess}°`, 'dim');
const res = await runOnce(cam, 'default pose');
snap.getContext('2d').drawImage(cam.canvas, 0, 0);
if (res) {
  drawOverlay(res.r);
  const p = res.r.pose.t; log(`estimated: pos [${p.map(v => fmt(v, 3))}]  fovY ${fmt(res.r.fovY, 3)}°`, 'dim');
}

if (q.has('sweep')) {
  const poses = [[[-1.2, 1.8, 4.6], [0, 1, -.5], -3, 55], [[1.6, 1.3, 3.6], [0, 1.1, -1], 4, 60], [[0, 2.2, 5.2], [0, .9, -.5], 0, 45], [[-.6, 1.5, 3.2], [.2, 1.2, -1], 1, 70]];
  for (const [i, [pos, tgt, roll, fov]] of poses.entries()) {
    const c = createDummyCam({ width: 1280, height: 720, fovY: fov, pose: lookAtPose(pos, tgt, roll) });
    await runOnce(c, `sweep ${i} pos [${pos}] fov ${fov}`, 2 + i);
    c.stop();
  }
}
if (q.has('dbg')) {
  const { detectTags } = await import('./extrinsics.js');
  cam.render(1); const ds = await detectTags(cam.canvas, W.CORNER_IDS), tp = { ...cam.truePose, width: 1280, height: 720 };
  for (const d of ds) {
    const ts = W.worldTagPose(d.id), hh = W.TAGS[d.id].size / 2;
    const tru = [[-hh, hh], [hh, hh], [hh, -hh], [-hh, -hh]].map(([x, y]) => projectWorld(tp, W.apply(ts, [x, y, 0])));
    const f = c => c.map((p, k) => `(${fmt(p[0] - tru[k][0])},${fmt(p[1] - tru[k][1])})`).join(' ');
    log(`dbg ${d.id}: true ${tru.map(p => fmt(p[0], 1) + ',' + fmt(p[1], 1)).join(' ')}\n  coarse ${f(d.coarse)}\n  refined ${f(d.corners)}`);
  }
}
if (q.has('png')) { // frame + true pose for an offline OpenCV cross-check (--dump-dom)
  cam.render(1); const pre = document.createElement('pre'); pre.id = 'png';
  pre.textContent = JSON.stringify({ png: cam.canvas.toDataURL('image/png'), truePose: cam.truePose }); document.body.append(pre);
}
if (q.has('grid')) { // detection limits: one fixed tag, empty arena, camera at distance d and obliquity th from its normal
  const { detectTags } = await import('./extrinsics.js');
  const id = W.CORNER_IDS[0], tp = W.worldTagPose(id), n = [tp.R[2], tp.R[5], tp.R[8]], f = 360 / Math.tan(cam.truePose.fovY * d2r / 2);
  cam.showPlayers(false);
  log(`grid: tag ${id} (${W.TAGS[id].size * 100} cm), fovY ${cam.truePose.fovY}, 1280x720. cell = tag height px / 8 x cos(obliquity) across`, 'dim');
  for (const d of [3, 4, 5, 6, 7]) {
    const row = [];
    for (const th of [15, 30, 45, 55, 60, 65, 70, 75]) { // (0° looks through the opposite pole)
      const c = Math.cos(th * d2r), s = Math.sin(th * d2r), v = [n[0] * c - n[2] * s, 0, n[0] * s + n[2] * c];
      const pos = tp.t.map((x, i) => x + d * v[i] + (i === 1 ? .3 : 0));
      cam.setPose(lookAtPose(pos, [tp.t[0] - .3 * v[2], tp.t[1] + .1, tp.t[2] + .3 * v[0]], 1)); cam.render(0);
      const det = (await detectTags(cam.canvas, [id]))[0];
      let err = NaN;
      if (det) { const hh = W.TAGS[id].size / 2, tr = { ...cam.truePose, width: 1280, height: 720 };
        err = Math.sqrt([[-hh, hh], [hh, hh], [hh, -hh], [-hh, -hh]].reduce((a, [x, y], k) => { const p = projectWorld(tr, W.apply(tp, [x, y, 0])); return a + (p[0] - det.corners[k][0]) ** 2 + (p[1] - det.corners[k][1]) ** 2; }, 0) / 4); }
      row.push(`${th}°:${det ? `ok x${det.scale} ${fmt(err)}px` : '--'}`);
    }
    if (q.get('grid') == d) { const v = n, pos = tp.t.map((x, i) => x + d * v[i] + (i === 1 ? .3 : 0)); cam.setPose(lookAtPose(pos, [tp.t[0] - .3 * v[2], tp.t[1] + .1, tp.t[2] + .3 * v[0]], 1)); cam.render(0); snap.getContext('2d').drawImage(cam.canvas, 0, 0); }
    log(`d ${d} m (tag ${fmt(W.TAGS[id].size * f / d, 0)} px tall): ${row.join('  ')}`);
  }
}
window.__done = true;

// live: recalibrate on the moving room every 3 s (players move, tags don't)
if (!q.has('still')) setInterval(async () => { const r = await calibrateCamera(cam.canvas, { fovYGuess: guess }); if (r) drawOverlay(r); }, 3000);
</script>
</body>
</html>
