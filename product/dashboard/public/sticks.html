<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>棒設定</title>
<link rel="icon" href="data:,">
<style>
  /* the dashboard's tokens and parts (index.html), so a phone sees the same screen 5 */
  :root {
    color-scheme: dark;
    --bg: #0a0c11; --surface: #11141b; --surface-2: #171b24; --line: #222836;
    --text: #e8eaf0; --text-2: #b3b9c7; --muted: #7d8597;
    --A: #ff3b3b; --B: #2fd46a; --C: #ffd23d; --warn: #ffcc4d; --bad: #ff6b6b; --accent: #a99dff;
    --radius: 10px;
    font: 13px/1.5 system-ui, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  button, input { font: inherit; color: var(--text); }
  button { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap; min-height: 36px; }
  button:hover { border-color: #3a4256; }
  button.go { background: #2a2350; border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  input[type=number], input[type=text] { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
  .card > header { display: flex; gap: 10px; align-items: baseline; margin-bottom: 8px; flex-wrap: wrap; }
  .card h2 { margin: 0; font-size: 15px; font-weight: 700; }
  .card .sub { color: var(--muted); font-size: 12px; }
  h3 { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); margin: 0; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
</style>
<link rel="stylesheet" href="sticks.css">
</head>
<body>
<div id="sticksRoot"></div>
<script type="module">
  import { mountSticks } from './sticks.js';
  mountSticks(document.getElementById('sticksRoot'));
</script>
</body>
</html>
