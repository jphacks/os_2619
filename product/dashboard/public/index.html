<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full Stick ダッシュボード</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="sticks.css">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0c11; --surface: #11141b; --surface-2: #171b24; --line: #222836; --grid: #1b202b;
    --text: #e8eaf0; --text-2: #b3b9c7; --muted: #7d8597;
    --A: #ff6600; --B: #0078ff; --C: #ffd23d; --tag: #3ddc84;
    --good: #3ddc84; --warn: #ffcc4d; --bad: #ff6b6b; --accent: #a99dff;
    --s1: #4c9bff; --s2: #ff8a3d; --s3: #3ddc84;
    --radius: 10px;
    font: 13px/1.5 system-ui, "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body { display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
  button, select, input { font: inherit; color: var(--text); }
  button { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap; }
  button:hover { border-color: #3a4256; }
  button.on, button[aria-pressed="true"] { background: #262b3f; border-color: var(--accent); color: #fff; }
  button.go { background: #2a2350; border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  select, input[type=number], input[type=text] { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  input[type=range] { accent-color: var(--accent); }
  kbd { font: 11px ui-monospace, monospace; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); } .ok { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }

  /* ---- top bar ---- */
  header.bar { display: flex; align-items: center; gap: 18px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: #0c0f15; }
  .brand { font-weight: 800; letter-spacing: .08em; font-size: 15px; }
  .brand small { font-weight: 400; color: var(--muted); letter-spacing: .02em; margin-left: 8px; font-size: 12px; }
  nav.tabs { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  nav.tabs button { border: 0; background: transparent; border-radius: 7px; padding: 5px 14px; color: var(--text-2); }
  nav.tabs button[aria-selected="true"] { background: var(--surface-2); color: #fff; box-shadow: inset 0 0 0 1px var(--line); }
  nav.tabs button span { color: var(--muted); font-size: 11px; margin-right: 6px; }
  .grow { flex: 1; }
  .pills { display: flex; gap: 6px; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: #3a4050; }
  .pill.on { color: var(--text); } .pill.on i { background: var(--good); box-shadow: 0 0 6px var(--good); }
  .pill.half i { background: var(--warn); }
  .pill b { font-weight: 700; }

  /* ---- screens ---- */
  main { position: relative; min-height: 0; }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.active { display: grid; }
  #scr-sticks { overflow: auto; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
  .card > header { display: flex; gap: 10px; align-items: baseline; margin-bottom: 8px; flex-wrap: wrap; }
  .card h2 { margin: 0; font-size: 15px; font-weight: 700; }
  .card .sub { color: var(--muted); font-size: 12px; }
  h3 { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); margin: 12px 0 4px; display: flex; gap: 8px; align-items: center; }
  h3:first-child { margin-top: 0; }
  .badge { font-size: 11px; padding: 0 8px; border-radius: 10px; border: 1px solid currentColor; }
  .off { color: var(--muted); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  td, th { text-align: left; padding: 2px 8px 2px 0; font-weight: normal; vertical-align: top; }
  th { color: var(--muted); font-size: 11px; }
  .kv { color: var(--text-2); font-variant-numeric: tabular-nums; }
  canvas { display: block; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .seg { display: inline-flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px; flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; padding: 3px 10px; border-radius: 6px; color: var(--text-2); }
  .seg button.on { background: var(--surface-2); color: #fff; box-shadow: inset 0 0 0 1px var(--accent); }

  /* connections */
  #scr-connect { grid-template-columns: minmax(0, 1fr) 340px; overflow: hidden; }
  #scr-connect > .scroll { overflow: auto; padding: 14px 16px; display: grid; gap: 12px; align-content: start; grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); }
  #scr-connect > aside { overflow: auto; padding: 14px 16px 14px 0; display: grid; gap: 12px; align-content: start; }
  .phone .cols { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 14px; }
  .phone canvas.video { width: 100%; aspect-ratio: 3 / 4; background: #000; border-radius: 8px; }
  .phone.C .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 220px); }
  .phone.C video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 8px; object-fit: contain; display: block; }
  .legend { display: flex; gap: 12px; font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  .chart { width: 100%; height: 72px; }
  .crow { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 8px; align-items: center; }
  .square { width: 100%; aspect-ratio: 1; }
  .who { font-weight: 700; }
  .server .urls { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; font-variant-numeric: tabular-nums; }
  .server .urls b { color: var(--text); font-weight: 600; word-break: break-all; }
  .qrs { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
  .qrs figure { margin: 0; text-align: center; font-size: 11px; color: var(--muted); }
  .qrs svg { width: 112px; height: 112px; background: #fff; border-radius: 6px; display: block; margin-bottom: 4px; }
  .actions, .history { list-style: none; margin: 0; padding: 0; }
  .actions li { padding: 6px 0; border-top: 1px solid var(--grid); transition: background .6s; }
  .actions li.hit { background: #1f2533; transition: none; }
  .actions .how { color: var(--muted); font-size: 12px; }
  .history li { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 0 8px; padding: 4px 0; border-top: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  .history .detail { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .history { max-height: 360px; overflow: auto; }
  .sticks label { margin-right: 10px; }
  .sticks input { width: 64px; }

  /* 3D space */
  #scr-space { grid-template-columns: minmax(0, 1fr) 360px; }
  .view { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #07090d; }
  .view > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .floatlegend { position: absolute; left: 12px; top: 12px; background: rgba(10, 12, 17, .78); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: grid; gap: 3px; font-size: 12px; backdrop-filter: blur(4px); }
  .floatlegend label { display: flex; gap: 8px; align-items: center; cursor: pointer; color: var(--text-2); }
  .floatlegend label i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .floatlegend .note { color: var(--warn); max-width: 260px; }
  .hint { position: absolute; right: 12px; bottom: 10px; color: var(--muted); font-size: 11px; }
  aside.panel { overflow: auto; border-left: 1px solid var(--line); padding: 12px 14px; background: var(--surface); }
  aside.panel table td:first-child { color: var(--muted); white-space: nowrap; width: 1%; }
  aside.panel td.v { font-variant-numeric: tabular-nums; word-break: break-all; }

  /* game + final */
  #scr-game { grid-template-columns: minmax(0, 1fr) 320px; }
  #scr-final { grid-template-rows: minmax(0, 1fr) auto; }
  .stagebox { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #000; display: grid; place-items: center; }
  .stage { position: relative; }
  .stage > canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage > canvas.guide2d { pointer-events: none; }
  .ctrl { overflow: auto; border-left: 1px solid var(--line); background: var(--surface); padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
  .ctrl .phase { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .ctrl .phase button { padding: 8px; }
  .ctrl .phase .bigstart { grid-column: 1 / -1; order: -1; padding: 16px 8px; font-size: 20px; font-weight: 800; } /* デモ試合開始: the one start button, big and first */
  .why { color: var(--warn); font-size: 12px; min-height: 1em; margin: 4px 0; }
  .log { list-style: none; padding: 0; margin: 0; font-size: 12px; max-height: 300px; overflow: auto; }
  .log li { display: grid; grid-template-columns: auto auto 1fr; gap: 6px; padding: 3px 0; border-top: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
  .log .t { color: var(--muted); }
  .players2 { display: grid; gap: 8px; }
  .players2 .pc { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .rules { display: grid; gap: 4px; font-size: 13px; }
  .fxtry { display: grid; gap: 4px; } .fxtry .row { gap: 4px; align-items: center; }
  .rules label { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--text-2); }
  .rules input { width: 72px; }
  .players2 .pc .facts { color: var(--text-2); font-size: 12px; font-variant-numeric: tabular-nums; min-height: 2.6em; }
  .toolbar { display: flex; gap: 8px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
  .toolbar .msg { color: var(--text-2); font-size: 12px; flex: 1 1 300px; min-width: 0; }
  #finalBar { display: grid; gap: 6px; align-items: stretch; }
  #finalBar .final-control-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; align-items: center; }
  #finalBar .final-control-title { color: var(--text-2); font-size: 12px; letter-spacing: .04em; }
  #finalBar .final-control-items, #finalBar .final-shared-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
  #finalBar .final-control-items > .msg { flex: 0 1 auto; }
  #finalBar .final-shared-controls { margin-left: auto; padding-left: 10px; border-left: 1px solid var(--line); }

  /* HUD (game + final) */
  /* the game screen's lettering: Barlow Condensed for Latin and numbers, Dela Gothic One for Japanese (each has one face, so nothing is synthesised) */
  @font-face { font-family: 'Barlow Condensed'; src: url(assets/fonts/BarlowCondensed-ExtraBoldItalic.ttf) format('truetype'); font-weight: 800; font-style: italic; font-display: swap; }
  @font-face { font-family: 'Dela Gothic One'; src: url(assets/fonts/DelaGothicOne-Regular.ttf) format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
  .hud { position: absolute; inset: 0; pointer-events: none; font-family: 'Barlow Condensed', 'Dela Gothic One', sans-serif; font-weight: 800; font-style: italic; font-synthesis: none; }
  .stage.crt .hud { filter: blur(1px) drop-shadow(0 0 4px rgba(255, 255, 255, .45)); } /* the CRT look (stage.js) on the HUD too: soft, glowing */
  .hud .pl { position: absolute; top: 12px; width: 38%; text-shadow: 0 0 8px #000; display: grid; grid-template-columns: 92px minmax(0, 1fr); column-gap: 10px; align-content: start; }
  .hud .pl > :not(.gauge) { grid-column: 2; }
  .hud .pl.B { grid-template-columns: minmax(0, 1fr) 92px; } .hud .pl.B > :not(.gauge) { grid-column: 1; }
  .hud .gauge { grid-row: 1 / span 2; position: relative; width: 92px; height: 91px; }
  .hud .pl.B .gauge { grid-column: 2; }
  .hud .gauge svg { width: 100%; height: 100%; display: block; overflow: visible; filter: url(#hardShadow); }
  .hud .pl.B .gauge svg { transform: scaleX(-1); filter: url(#hardShadowB); } /* mirrored after the filter */
  .hud .gauge .track { fill: rgba(8,10,16,.55); stroke: #fff; stroke-width: 1.25; stroke-linejoin: round; }
  .hud .gauge .frame { fill: none; stroke: #fff; stroke-width: 1.25; stroke-linejoin: round; }
  .hud .gauge .glow { fill: none; stroke: rgba(255,255,255,.85); stroke-width: 4.5; filter: blur(1.5px); }
  .hud .gauge .fill { fill: #ffe600; }
  .hud .gauge canvas { position: absolute; }
  .hud .pl.B .gauge canvas { transform: scaleX(-1); }
  .hud .gauge .edge { fill: none; stroke: #fff; stroke-width: 1; }
  .hud .gauge .disc { fill: rgba(8,10,16,.55); stroke: #fff; stroke-width: 1; }
  .hud .gauge .staff { fill: #fff; }
  .hud .gauge .lv { position: absolute; left: 24px; top: 36px; transform: translate(-50%, -100%); white-space: nowrap; font-size: 68px; line-height: .74; font-weight: 900; font-style: italic; color: #fff; -webkit-text-stroke: 1px #000; paint-order: stroke fill; text-shadow: 0 2px 4px #000; letter-spacing: -.02em; }
  .hud .pl.B .gauge .lv { left: auto; right: 24px; transform: translate(50%, -100%); } /* centred on one axis, so 1, 2 and Full line up: a digit's lower inner corner is one third into the square around the disc */
  .hud .pl.A { left: 38px; } .hud .pl.B { right: 38px; text-align: right; } /* room for "Full" and the flame */
  .hud .name { display: flex; gap: 10px; align-items: baseline; font-size: 40px; line-height: 1; font-weight: 600; letter-spacing: .08em; }
  .hud .pl.B .name { flex-direction: row-reverse; }
  .hud .name small { font-size: 32px; font-weight: 400; color: #8a8f99; }
  .hud .barwrap { position: relative; }
  /* on the bar's lower outer corner: its top third and its inner three quarters lie over the bar (left: where the slanted bar's lower corner is) */
  .hud .hpn { position: absolute; top: 100%; left: 14px; transform: translate(-25%, -33.3%); font-size: 44px; line-height: .74; font-variant-numeric: tabular-nums; color: #fff; -webkit-text-stroke: 1px #000; paint-order: stroke fill; text-shadow: 0 2px 4px #000; }
  .hud .pl.B .hpn { left: auto; right: 14px; transform: translate(25%, -33.3%); }
  .hud .meter { height: 4px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 6px; position: relative; }
  .hud .meter i { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; transition: width .15s; }
  .hud .pl.B .meter i { left: auto; right: 0; }
  .hud .pl.A .hp i { background: var(--A); } .hud .pl.B .hp i { background: var(--B); }
  .hud .pl.A .hp i.low, .hud .pl.B .hp i.low { background: #ff2a2a; } /* 20 % or less */
  .hud .meter.hp { height: 30px; border: 1px solid #fff; background: rgba(8,10,16,.55); overflow: visible; transform: skewX(20deg); margin: 6px 8px 0; box-shadow: 2.54px 4px 0 #000; } /* thick and easy to read from a distance */
  .hud .pl.B .meter.hp { transform: skewX(-20deg); box-shadow: 5.46px 4px 0 #000; }
  .hud .meter.hp span { display: block; position: relative; height: 100%; overflow: hidden; }
  .hud .meter.hp span::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 4px .5px rgba(255,255,255,.85); pointer-events: none; }
  .hud .mid { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); text-align: center; }
  .hud .timer { font-size: 85px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; text-shadow: 0 0 8px #000; }
  .hud .phasepill { display: inline-block; margin-top: 2px; padding: 2px 14px; border-radius: 999px; background: rgba(0,0,0,.55); color: #c9cfdc; font-size: 13px; letter-spacing: .1em; }
  .hud .dmg { position: absolute; font-weight: 900; line-height: 1; color: #fff; white-space: nowrap; font-variant-numeric: tabular-nums;
    -webkit-text-stroke: 2px rgba(0,0,0,.9); paint-order: stroke fill; text-shadow: 0 2px 10px rgba(0,0,0,.8); }
  .hud .dmg.m { color: #ffc94a; } .hud .dmg.l { color: #ff5a3a; }
  .hud .banner { position: absolute; inset: 0; display: none; place-items: center; font-size: 76px; font-weight: 900; letter-spacing: .06em; text-shadow: 0 0 24px #000; }
  /* one shadow for the whole HUD: a hard black silhouette, 4 px right and down, never under the see-through parts. Lettering: white, damage in red (the filters at the top of the body; field3d.js's letters do the same) */
  .hud .gauge .lv, .hud .timer, .hud .banner, .hud .name, .hud .hpn { color: #fdfdff; -webkit-text-stroke: 0; text-shadow: none; filter: url(#ink); }
  .hud .name small { color: inherit; -webkit-text-stroke: 0; text-shadow: none; }
  .hud .dmg, .hud .dmg.m, .hud .dmg.l { color: #d7000a; -webkit-text-stroke: 0; text-shadow: none; filter: url(#ink); }
  .hud .phasepill { color: #fdfdff; text-shadow: 2px 2px 0 #000; }
  .hud .flash { position: absolute; inset: 0; opacity: 0; transition: opacity .25s; }
  .hud .minimap { position: absolute; left: 14px; bottom: 14px; width: min(26%, 26vh); aspect-ratio: 1; }
  .hud .status { position: absolute; left: 14px; bottom: 8px; color: #aab; font-size: 11px; font-weight: 400; text-shadow: 0 0 4px #000; }
  /* the end of a match (ko-show.js): --ko is the winner's element colour. Sizes follow the stage (container units), so the final screen's picture fits too */
  .hud .ko { position: absolute; inset: 0; display: none; container-type: size; overflow: hidden; --ink: drop-shadow(4px 4px 0 #000); }
  .hud .ko.on { display: block; }
  .hud .ko-flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  .hud .ko.flash .ko-flash { opacity: 1; }
  .hud .ko-stamp { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .25s; }
  .hud .ko-stamp span { font-size: 27cqh; font-weight: 900; letter-spacing: .02em; line-height: 1; color: #fff; -webkit-text-stroke: .6cqh var(--ko); paint-order: stroke fill; filter: var(--ink); }
  .hud .ko.is-time .ko-stamp span { font-size: 17cqh; }
  .hud .ko.stamp .ko-stamp { opacity: 1; transition: none; }
  .hud .ko.stamp .ko-stamp span { animation: ko-slam .2s cubic-bezier(.2,.9,.3,1.3) both, ko-jolt .3s .2s steps(6) both; }
  @keyframes ko-slam { from { transform: scale(1.7) rotate(-8deg); opacity: 0; } to { transform: scale(1) rotate(-5deg); opacity: 1; } }
  @keyframes ko-jolt { 0%, 100% { translate: 0 0; } 20% { translate: -1.2cqh .6cqh; } 40% { translate: 1cqh -.8cqh; } 60% { translate: -.6cqh .4cqh; } 80% { translate: .3cqh 0; } }

  .hud:has(.ko.result) :is(.pl, .mid, .minimap), .hud:has(.ko.intro) .mid { opacity: 0; transition: opacity .3s; } /* the results and the intro stand alone */
  .hud .ko-res { position: absolute; inset: 0; visibility: hidden; }
  .hud .ko.result .ko-res { visibility: visible; }
  .hud .ko-band { position: absolute; inset: 0 0 0 38%; background: linear-gradient(100deg, color-mix(in srgb, var(--ko) 88%, #000) 0%, color-mix(in srgb, var(--ko) 45%, #05070b) 70%);
    clip-path: polygon(18% 0, 100% 0, 100% 100%, 0 100%); opacity: .94; }
  .hud .ko-band.thin { background: #fff; clip-path: polygon(16% 0, 17.2% 0, -.8% 100%, -2% 100%); opacity: 1; }
  .hud .ko.result .ko-band { animation: ko-wipe .32s cubic-bezier(.7,0,.2,1) both; }
  .hud .ko.result .ko-band.thin { animation: ko-wipe .26s cubic-bezier(.7,0,.2,1) both, ko-fade .5s .5s both; }
  @keyframes ko-wipe { from { translate: 110% 0; } to { translate: 0 0; } }
  @keyframes ko-fade { to { opacity: 0; } }

  .hud .ko-win { position: absolute; right: 6cqw; top: 6cqh; text-align: right; color: #fff; filter: var(--ink); transform: rotate(-4deg); transform-origin: right top; }
  .hud .ko-win small { display: block; font-size: 5.5cqh; letter-spacing: .3em; line-height: 1; }
  .hud .ko-win b { display: block; font-size: 30cqh; line-height: .82; font-weight: 900; letter-spacing: -.02em; }
  .hud .ko-win em { display: block; font-size: 4.6cqh; font-style: italic; font-weight: 600; letter-spacing: .06em; margin-top: .6cqh; }
  .hud .ko.result .ko-win { animation: ko-in-right .42s .14s cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes ko-in-right { from { translate: 30cqw 0; opacity: 0; } to { translate: 0 0; opacity: 1; } }

  .hud .ko-card { position: absolute; right: 6cqw; top: 54cqh; width: 40cqw; }
  .hud .ko-card table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; color: #fff; }
  .hud .ko-card th, .hud .ko-card td { padding: .5cqh 1cqw; line-height: 1; }
  .hud .ko-card thead th { font-size: 3.6cqh; letter-spacing: .12em; text-align: right; opacity: .75; }
  .hud .ko-card thead th.won { opacity: 1; }
  .hud .ko-card tbody tr { background: rgba(5,7,11,.62); transform: skewX(-14deg); border-bottom: .5cqh solid transparent; background-clip: padding-box; }
  .hud .ko-card tbody tr > * { transform: skewX(14deg); }
  .hud .ko-card tbody th { text-align: left; font-size: 3.6cqh; font-weight: 600; letter-spacing: .06em; white-space: nowrap; }
  .hud .ko-card td { text-align: right; font-size: 5.4cqh; font-weight: 800; opacity: .6; width: 22%; }

  .hud .ko-rank { position: absolute; left: 50cqw; top: 12cqh; text-align: center; color: #fff; filter: var(--ink); }

  .hud .ko.result .ko-rank { animation: ko-rank .26s 1.55s cubic-bezier(.2,.9,.3,1.4) both; }
  @keyframes ko-rank { from { transform: scale(2.4) rotate(-14deg); opacity: 0; } to { transform: scale(1) rotate(-8deg); opacity: 1; } }

  .hud .ko-hint { position: absolute; right: 6cqw; bottom: 4cqh; font-size: 3cqh; letter-spacing: .14em; color: #fff; opacity: 0; filter: var(--ink); }

  @keyframes ko-blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  /* the start (ko-show.js introLine): name cards, VS, READY, FIGHT! */
  .hud .mi { position: absolute; inset: 0; display: none; }
  .hud .ko.intro .mi { display: block; }
  .hud .mi-card { position: absolute; bottom: 12cqh; width: 40cqw; padding: 2cqh 3cqw 2.4cqh; color: #fff; opacity: 0;
    background: linear-gradient(90deg, color-mix(in srgb, var(--pc) 90%, #000), color-mix(in srgb, var(--pc) 35%, #05070b)); filter: drop-shadow(5px 5px 0 #000); }
  .hud .mi-card.A { left: 0; clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%); }
  .hud .mi-card.B { right: 0; text-align: right; clip-path: polygon(12% 0, 100% 0, 100% 100%, 0 100%); background: linear-gradient(270deg, color-mix(in srgb, var(--pc) 90%, #000), color-mix(in srgb, var(--pc) 35%, #05070b)); }
  .hud .mi-card small { display: block; font-size: 3.2cqh; letter-spacing: .4em; line-height: 1; }
  .hud .mi-card b { display: block; font-size: 17cqh; line-height: .85; font-weight: 900; text-shadow: .5cqh .5cqh 0 #000; }
  .hud .mi-card em { display: block; font-size: 4cqh; font-weight: 600; letter-spacing: .06em; }
  .hud .ko.cardA .mi-card.A { animation: mi-from-left .38s cubic-bezier(.2,1.2,.4,1) both; }
  .hud .ko.cardB .mi-card.B { animation: mi-from-right .38s cubic-bezier(.2,1.2,.4,1) both; }
  .hud .ko.fight .mi-card.A { opacity: 1; animation: mi-out-left .3s cubic-bezier(.6,0,.9,.4) both; }
  .hud .ko.fight .mi-card.B { opacity: 1; animation: mi-out-right .3s cubic-bezier(.6,0,.9,.4) both; }
  @keyframes mi-from-left { from { translate: -45cqw 0; opacity: 1; } to { translate: 0 0; opacity: 1; } }
  @keyframes mi-from-right { from { translate: 45cqw 0; opacity: 1; } to { translate: 0 0; opacity: 1; } }
  @keyframes mi-out-left { to { translate: -45cqw 0; } }
  @keyframes mi-out-right { to { translate: 45cqw 0; } }
  .hud .mi-vs { position: absolute; left: 50%; bottom: 14cqh; translate: -50% 0; font-size: 16cqh; font-weight: 900; color: #fff; -webkit-text-stroke: .5cqh #000; paint-order: stroke fill; opacity: 0; filter: drop-shadow(4px 4px 0 #000); }
  .hud .ko.vs .mi-vs { animation: ko-slam .22s cubic-bezier(.2,.9,.3,1.3) both, ko-jolt .3s .22s steps(6) both; }
  .hud .mi-call { position: absolute; inset: 0 0 auto; top: 26cqh; text-align: center; }
  .hud .mi-call span { display: none; font-size: 20cqh; font-weight: 900; line-height: 1; color: #fff; filter: drop-shadow(5px 5px 0 #000); }
  .hud .mi-call .ready { font-size: 11cqh; letter-spacing: .4em; }
  .hud .ko.ready .mi-call .ready { display: inline-block; animation: mi-ready .35s cubic-bezier(.2,.8,.3,1) both; }
  .hud .ko.fight .mi-call .fight { display: inline-block; -webkit-text-stroke: .5cqh #d7000a; paint-order: stroke fill; animation: ko-slam .2s cubic-bezier(.2,.9,.3,1.3) both, ko-jolt .3s .2s steps(6) both, ko-fade .25s .55s both; }
  @keyframes mi-ready { from { letter-spacing: 1.4em; opacity: 0; } to { letter-spacing: .4em; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .hud .ko *, .hud .ko *::before { animation-duration: .01s !important; animation-delay: 0s !important; } }

  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>

      <feOffset dx="4" dy="4"/><feComposite in2="shape" operator="out" result="shadow"/>

    </filter>
    <filter id="hardShadowB" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feComponentTransfer in="SourceAlpha" result="shape"><feFuncA type="discrete" tableValues="0 1 1 1 1 1 1 1"/></feComponentTransfer>
      <feOffset dx="-4" dy="4"/><feComposite in2="shape" operator="out" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>

  </defs></svg>
