<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>魔法エフェクト素材の確認</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#0c111b;color:#edf1f7;font:15px/1.7 system-ui,sans-serif}main{max-width:1360px;margin:auto}h1{font-size:24px;margin:0}p{color:#aebacd;margin:8px 0 20px}.controls{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:24px}select{margin-left:10px;padding:8px;border-radius:6px;border:1px solid #40516a;background:#172235;color:#fff}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{margin:0;border:1px solid #364356;border-radius:12px;overflow:hidden;background:#151e2c}.sample{height:300px;display:grid;place-items:center;background:#111824}.sample img{width:90%;height:90%;object-fit:contain}.sample.light{background:#e8ebef}.sample.checker{background-color:#87909b;background-image:conic-gradient(#677380 25%,transparent 0 50%,#677380 0 75%,transparent 0);background-size:24px 24px}.fire img{filter:brightness(.72) sepia(1) saturate(5) hue-rotate(345deg)}.thunder img{filter:brightness(.72) sepia(1) saturate(3) hue-rotate(150deg)}figcaption{padding:14px 16px}strong{display:block;font-size:14px}small{color:#aebacd}a{color:#a9caff}.note{margin-top:24px;font-size:13px}
</style>
<main>
<h1>魔法エフェクト用テクスチャ · 11枚</h1>
<p>炎や電気の局所的な部品です。完成した技のアニメーションや、3Dでの組み込み結果ではありません。</p>
<div class="controls"><label>背景<select id="background"><option value="dark">暗い背景</option><option value="light">明るい背景</option><option value="checker">透過チェック</option></select></label><label>表示色<select id="tint"><option value="">元のグレー</option><option value="fire">炎の色</option><option value="thunder">電気の色</option></select></label></div>
<div id="grid"></div>
<p class="note">表示色はCSSによる簡易確認です。ゲームではシェーダーの着色・発光・合成を調整してください。PNG本体には加工していません。<a href="README.md">用途と3D配置の説明</a></p>
</main>
<script>
const assets=[['flame-density','炎の一房'],['explosion-density','爆炎を構成する一塊'],['smoke-puff','薄い煙の塊'],['electric-filament','局所的な放電'],['aura-wisp','上昇するチャージの筋'],['plasma-flow','球の周囲を流れるエネルギー'],['glow','中心光とハロー'],['spark','短い火花'],['flame-tongue','中心が明るい炎の一房'],['short-flame','炎小の着弾専用の短い炎'],['electric-spike','鋭く枝分かれした放電'],['fire-lobe-v2','炎攻撃に使用する色付きの炎'],['electric-arc-v2','電気小・中の鋭い横向き放電'],['electric-burst-v2','電気の着弾用放射状放電']];
const grid=document.getElementById('grid');
for(const [name,label] of assets){const card=document.createElement('figure');card.className='card';const sample=document.createElement('div');sample.className='sample';const image=document.createElement('img');image.src=`textures/${name}.png`;image.alt=label;sample.append(image);const caption=document.createElement('figcaption');const title=document.createElement('strong');const link=document.createElement('a');link.href=image.src;link.textContent=name+'.png';title.append(link);const desc=document.createElement('small');desc.textContent=label;caption.append(title,desc);card.append(sample,caption);grid.append(card);}
function update(){for(const sample of document.querySelectorAll('.sample'))sample.className=`sample ${document.getElementById('background').value} ${document.getElementById('tint').value}`;}
document.getElementById('background').addEventListener('change',update);document.getElementById('tint').addEventListener('change',update);
</script>
</html>
